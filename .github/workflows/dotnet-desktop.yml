name: Build Jellyfin Tizen Client

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build:
    name: Build TPK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pin dotnet to 8.x
        run: |
          DOTNET8_VER=$(dotnet --list-sdks | grep '^8\.' | tail -1 | awk '{print $1}')
          cat > global.json << EOF
          {
            "sdk": {
              "version": "${DOTNET8_VER}",
              "rollForward": "patch"
            }
          }
          EOF
          dotnet --version

      - name: Install Tizen workload
        run: |
          curl -sSL https://raw.githubusercontent.com/Samsung/Tizen.NET/main/workload/scripts/workload-install.sh \
            | sudo bash

      - name: Verify Tizen workload
        run: dotnet workload list

      - name: Restore dependencies
        run: |
          dotnet restore jellyfin.sln \
            --source https://api.nuget.org/v3/index.json \
            --ignore-failed-sources

      - name: Build project
        run: |
          dotnet build jellyfin/jellyfin.csproj \
            -c ${{ github.event.inputs.configuration }} \
            --no-restore \
            -v minimal

      - name: Stage TPK
        run: |
          SRC_DIR="jellyfin/bin/${{ github.event.inputs.configuration }}/net6.0-tizen9.0"
          mkdir -p staging
          cp "$SRC_DIR"/*.tpk "staging/jellyfin-tizen-${{ github.event.inputs.configuration }}.tpk"

      - name: Upload TPK
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-tizen-${{ github.event.inputs.configuration }}
          path: staging/*.tpk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: jellyfin-tizen-*
          merge-multiple: true

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.date.outputs.date }}-${{ github.run_number }}
          name: Jellyfin Tizen Client Release v${{ steps.date.outputs.date }} (Build #${{ github.run_number }})
          body: |
            ## Jellyfin Tizen Client Build

            **Configuration:** ${{ github.event.inputs.configuration }}
            **Date:** ${{ steps.date.outputs.date }}
            **Commit:** ${{ github.sha }}

            Install the `.tpk` using Tizen Studio or `sdb install <file>.tpk`.
          files: artifacts/*.tpk
          draft: false
          prerelease: ${{ github.event.inputs.configuration == 'Debug' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
